[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baizo"
version = "0.2.0"
description = "Baizo: Intelligent local-first desktop search engine, indexer, and AI assistant."
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10"
authors = [{name = "Baizo Contributors", email = "contributors@baizo.ai"}]
license = "MIT"
keywords = [
    "search",
    "desktop-assistant",
    "indexer",
    "fts5",
    "ai-agent",
    "local-first",
    "cli",
    "grep",
    "sqlite",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Filesystems",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
ui = ["rich>=13.0.0"]
pdf = ["pypdfium2>=4.30.0"]
watch = ["watchdog>=6.0.0"]
ai = ["httpx>=0.25.0", "pydantic>=2.0.0"]
all = [
    "rich>=13.0.0",
    "pypdfium2>=4.30.0",
    "watchdog>=6.0.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.scripts]
baizo = "baizo.cli:main"
jarvis = "baizo.cli:main"

[project.urls]
Homepage = "https://github.com/baizo-ai/baizo"
Repository = "https://github.com/baizo-ai/baizo"
Issues = "https://github.com/baizo-ai/baizo/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
